name: Release Linux binary

on:
  push:
  release:
    types: [published]

permissions:
  contents: write

concurrency:
  group: release-publisher
  cancel-in-progress: false

jobs:
  linux:
    name: Build Linux release binaries
    runs-on: ubuntu-24.04
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true

      - name: Test
        run: go test ./...

      - name: Resolve release metadata
        id: release
        env:
          EVENT_NAME: ${{ github.event_name }}
          EVENT_RELEASE_TAG: ${{ github.event.release.tag_name }}
          REF_NAME: ${{ github.ref_name }}
          REF_TYPE: ${{ github.ref_type }}
        run: |
          if [[ "${EVENT_NAME}" == "release" ]]; then
            tag="${EVENT_RELEASE_TAG}"
          elif [[ "${REF_TYPE}" == "tag" && "${REF_NAME}" =~ ^v2\.[0-9]+$ ]]; then
            tag="${REF_NAME}"
          else
            highest=0
            while read -r _ ref; do
              candidate="${ref#refs/tags/}"
              if [[ "${candidate}" =~ ^v2\.([0-9]+)$ ]] && (( BASH_REMATCH[1] > highest )); then
                highest="${BASH_REMATCH[1]}"
              fi
            done < <(git ls-remote --tags origin 'refs/tags/v2.*')
            tag="v2.$((highest + 1))"
          fi
          echo "tag=${tag}" >> "${GITHUB_OUTPUT}"

      - name: Build release binary
        env:
          RELEASE_TAG: ${{ steps.release.outputs.tag }}
        run: |
          mkdir -p dist
          for arch in amd64 arm64; do
            binary="dist/secret-sniffer-linux-${arch}"
            CGO_ENABLED=0 GOOS=linux GOARCH="${arch}" go build \
              -trimpath \
              -ldflags="-s -w -X main.version=${RELEASE_TAG}" \
              -o "${binary}" \
              ./cmd/secret-sniffer
            (cd dist && sha256sum "secret-sniffer-linux-${arch}" > "secret-sniffer-linux-${arch}.sha256")
          done

      - name: Create release and upload assets
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ steps.release.outputs.tag }}
          COMMIT_SHA: ${{ github.sha }}
        run: |
          if ! gh release view "${RELEASE_TAG}" >/dev/null 2>&1; then
            gh release create "${RELEASE_TAG}" \
              --target "${COMMIT_SHA}" \
              --generate-notes \
              --latest \
              --title "${RELEASE_TAG}"
          else
            gh release edit "${RELEASE_TAG}" --latest
          fi
          gh release upload "${RELEASE_TAG}" \
            dist/secret-sniffer-linux-amd64 \
            dist/secret-sniffer-linux-amd64.sha256 \
            dist/secret-sniffer-linux-arm64 \
            dist/secret-sniffer-linux-arm64.sha256 \
            --clobber

          gh release list --limit 100 --json tagName --jq '.[] | select(.tagName | startswith("build-")) | .tagName' | \
            while read -r obsolete_tag; do
              gh release delete "${obsolete_tag}" --cleanup-tag --yes
            done
