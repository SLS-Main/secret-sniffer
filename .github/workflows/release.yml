name: Release Linux binary

on:
  push:
  release:
    types: [published]

permissions:
  contents: write

jobs:
  linux:
    name: Build Linux release binaries
    runs-on: ubuntu-24.04
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true

      - name: Test
        run: go test ./...

      - name: Resolve release metadata
        id: release
        env:
          EVENT_NAME: ${{ github.event_name }}
          EVENT_RELEASE_TAG: ${{ github.event.release.tag_name }}
          REF_NAME: ${{ github.ref_name }}
          REF_TYPE: ${{ github.ref_type }}
          COMMIT_SHA: ${{ github.sha }}
        run: |
          if [[ "${EVENT_NAME}" == "release" ]]; then
            tag="${EVENT_RELEASE_TAG}"
            title="${EVENT_RELEASE_TAG}"
            prerelease="false"
          elif [[ "${REF_TYPE}" == "tag" ]]; then
            tag="${REF_NAME}"
            title="${REF_NAME}"
            prerelease="false"
          else
            short_sha="${COMMIT_SHA:0:12}"
            tag="build-${short_sha}"
            title="Automated build ${short_sha}"
            prerelease="true"
          fi
          echo "tag=${tag}" >> "${GITHUB_OUTPUT}"
          echo "title=${title}" >> "${GITHUB_OUTPUT}"
          echo "prerelease=${prerelease}" >> "${GITHUB_OUTPUT}"

      - name: Build release binary
        env:
          RELEASE_TAG: ${{ steps.release.outputs.tag }}
        run: |
          mkdir -p dist
          for arch in amd64 arm64; do
            binary="dist/secret-sniffer-linux-${arch}"
            CGO_ENABLED=0 GOOS=linux GOARCH="${arch}" go build \
              -trimpath \
              -ldflags="-s -w -X main.version=${RELEASE_TAG}" \
              -o "${binary}" \
              ./cmd/secret-sniffer
            (cd dist && sha256sum "secret-sniffer-linux-${arch}" > "secret-sniffer-linux-${arch}.sha256")
          done

      - name: Create release and upload assets
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ steps.release.outputs.tag }}
          RELEASE_TITLE: ${{ steps.release.outputs.title }}
          PRERELEASE: ${{ steps.release.outputs.prerelease }}
          COMMIT_SHA: ${{ github.sha }}
        run: |
          if ! gh release view "${RELEASE_TAG}" >/dev/null 2>&1; then
            args=("${RELEASE_TAG}" --target "${COMMIT_SHA}" --generate-notes --title "${RELEASE_TITLE}")
            if [[ "${PRERELEASE}" == "true" ]]; then
              args+=(--prerelease)
            fi
            gh release create "${args[@]}"
          fi
          gh release upload "${RELEASE_TAG}" \
            dist/secret-sniffer-linux-amd64 \
            dist/secret-sniffer-linux-amd64.sha256 \
            dist/secret-sniffer-linux-arm64 \
            dist/secret-sniffer-linux-arm64.sha256 \
            --clobber
